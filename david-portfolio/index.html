    <h1>David Geha - AI Consultant in Lebanon</h1>
    <p>David Geha is an independent AI consultant in Lebanon offering AI consulting, agentic AI automation
      and custom AI solutions for marketing agencies, F&amp;B businesses and founders in Beirut and across
      Lebanon.</p>

    <h2>AI consulting &amp; AI solutions in Lebanon</h2>
    <p>Lebanese businesses run lean. Small teams, tight margins, and a lot of manual work that quietly eats the week. As an independent AI consultant based in Lebanon, I help marketing agencies, F&amp;B operators, and founders replace that work with agentic AI systems built for how they actually operate, not for how a vendor's product works. Every engagement starts with a real audit and ends with a system in production and a number for the hours it gives back.</p>
    <h3>AI consulting for Lebanese businesses</h3>
    <p>I start with an audit of how your team actually works: where hours go, which tasks repeat every day, and what data already exists. You get a clear, prioritized map of what AI can take over now, what it should not touch yet, and what it will cost to build. No slide decks about "digital transformation", just a plan you can act on next week.</p>
    <h3>Agentic AI automation</h3>
    <p>Not a chatbot bolted onto your website. I build agentic systems that do the work end to end: sourcing and researching leads, writing and sending personalized outreach, generating on-brand ad creatives, compiling daily reports, and clearing back-office busywork. They run on their own, log what they did, and hand you the exceptions.</p>
    <h3>Custom AI solutions &amp; internal tools</h3>
    <p>When off-the-shelf software does not fit, I design and build the product: custom CRMs, dashboards, client portals, and web apps with AI baked into the workflow. Full stack, from UI/UX to backend and deploy, on a modern, low-maintenance stack of Supabase, Vercel, Claude, and GitHub, so you own the code and the data.</p>
    <h3>AI for marketing agencies &amp; F&amp;B</h3>
    <p>Most of my work is with marketing agencies and food &amp; beverage operators in Beirut and across Lebanon. Agencies get outreach engines, research pipelines, and ad-creative generation. F&amp;B teams get inventory, reporting, and supplier follow-ups automated. Same approach in every case: find the repeat work, build the system, measure the hours saved.</p>

    <h2>Working with an AI consultant in Lebanon</h2>
    <h3>What does an AI consultant in Lebanon actually do?</h3>
    <p>As an AI consultant based in Lebanon, I find the repetitive, manual work inside a business and replace it with custom agentic AI systems that run on their own. That covers the audit, the design of the system, the build, and the handover, so your team spends less time on busywork and more on the work that grows the business.</p>
    <h3>How much does AI consulting cost in Lebanon?</h3>
    <p>It depends on scope. A focused automation, such as a lead-outreach pipeline or a reporting workflow, is a fixed-price project measured in weeks, not months. Larger builds like a custom CRM or a client-facing app are scoped after a short audit. You always get a price before any work starts, and every project is sized against the hours it will save you.</p>
    <h3>What kind of businesses do you work with?</h3>
    <p>Mainly marketing agencies and F&amp;B businesses in Beirut and across Lebanon, plus founders who want to automate outreach, research, reporting, and other repeat tasks with AI. If your team does the same thing every day by hand, it is probably a fit.</p>
    <h3>What can you automate with AI?</h3>
    <p>Lead-outreach pipelines, competitive research and SEO/GEO pipelines, image-ad generation, custom CRMs and dashboards, and back-office workflows. Everything is built on a modern stack: Supabase, Vercel, Claude, and GitHub, so you own the code and the data.</p>
    <h3>Do you build AI solutions for companies outside Lebanon?</h3>
    <p>Yes. I am based in Lebanon and most of my clients are here, but the systems I build are remote-first by nature. I work with teams across the Middle East and with Lebanese founders abroad in the same way, over calls, shared repos, and a live dashboard of what the system is doing.</p>
    <h3>How do we get started?</h3>
    <p>Email david@osgdev.com with one or two sentences about the work your team repeats most. We map that work together on a short call, I come back with a scoped plan and a price, and then I design and build the agentic system that automates it and measure the productivity gain.</p>
